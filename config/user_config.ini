[Settings]
# 个人覆盖配置：只写需要覆盖默认值的项，未写的沿用 config/config.ini
# 注意：顶部 [Settings] 必须保留，否则下方配置不生效

# 频道模板：四组（央视/卫视/广东/凤凰）
source_file = config/user_demo.txt
# 结果文件：固定路径，供 raw / CDN 地址长期订阅
final_file = output/user_result.txt
# 命令行模式下不启动常驻 HTTP 服务，否则 CI 会挂住不退出
open_service = False

# ---- 测速策略 ----
# 注意：open_speed_test=False 会被解析为 manual 模式（仅采集、不出结果），必须保持 True。
# GitHub Actions 运行机在海外，到国内 IPTV 源延迟高、速率低，故把门槛压到「能连通即可」：
open_speed_test = True
speed_test_mode = quick
min_speed = 0.05
speed_test_timeout = 15
open_filter_resolution = False
# 每个频道最多保留多少条线路（多线路供播放器自动换线）
output_urls_limit = 8
sort_by = speed

# 定时执行间隔（仅命令行/GUI/Docker 生效；GitHub Actions 由 cron 控制）
update_mode = interval
update_interval = 12
# EPG 节目单
open_epg = True
