name: Update playlist

# 自建定时更新：跑一次生成，结果提交回仓库，raw 地址长期不变
# cron 时间为 UTC，0 22,10 * * * = 北京时间 06:00 与 18:00（与上游默认一致，勿调高频率）

on:
  schedule:
    - cron: '0 22,10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pipenv

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv --python 3.14
          pipenv install --deploy

      - name: Generate playlist
        env:
          IPTV_API_PLAIN_OUTPUT: '1'
        run: pipenv run dev

      - name: Verify result
        run: |
          f=output/user_result.txt
          if [ ! -s "$f" ]; then echo "::error::结果文件缺失或为空: $f"; exit 1; fi
          echo "有效接口行数: $(grep -c 'http' "$f" || true)"
          echo "频道分组数: $(grep -c '#genre#' "$f" || true)"
          head -8 "$f"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output
          if git diff --cached --quiet; then
            echo "本次无变化，跳过提交"
          else
            git commit -m "auto update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
